<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a22">
<title>Mission Map</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Map">
<!--
  SETUP
  1. Host this file over HTTPS (GitHub Pages, Netlify or Cloudflare Pages are free). GPS only works on HTTPS.
  2. Open the page, tap Setup, paste your Mapbox public token (pk...) and your style URL (mapbox://styles/you/id).
  3. In your Mapbox account, restrict the token to your site's URL so nobody else can use it.
-->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<style>
:root{--panel:#141a22ee;--ink:#f3efe6;--dim:#93a1b3;--acc:#ffc933;--mission:#ff5a4d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#141a22;color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:fixed;inset:0}
.panel{position:fixed;left:10px;right:10px;z-index:5;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff22;border-radius:14px;padding:12px;max-width:560px;margin:0 auto}
#banner{top:calc(10px + env(safe-area-inset-top));display:none;align-items:center;gap:14px;border-left:5px solid var(--acc)}
#arrow{font-size:46px;line-height:1;color:var(--acc);width:54px;text-align:center}
#btext{font-size:21px;font-weight:800;letter-spacing:-.01em}
#bdist{color:var(--acc);font-size:16px;font-weight:600}
#sheet{bottom:calc(10px + env(safe-area-inset-bottom))}
.row{display:flex;gap:8px;align-items:center}
input{flex:1;width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff33;background:#0006;color:var(--ink);font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;font-size:16px;background:var(--acc);color:#1a1300;cursor:pointer}
button.alt{background:#ffffff1f;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#go{flex:1}
#sum{font-size:18px;margin-bottom:10px}
#sum b{font-size:24px;margin-right:8px}
#sum span{color:var(--dim)}
#results{margin-bottom:8px}
.res{padding:10px 4px;border-top:1px solid #ffffff1a;cursor:pointer}
#settings{top:10px;z-index:8}
#settings label{display:block;margin:10px 0 4px;color:var(--dim);font-size:14px}
.hint{color:var(--dim);font-size:13px;margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(100px + env(safe-area-inset-top));background:#000d;color:#fff;padding:10px 14px;border-radius:10px;z-index:9;display:none;max-width:90%}
.me svg{filter:drop-shadow(0 0 6px #ffc933)}
</style>
</head>
<body>
<div id="map"></div>

<div id="banner" class="panel"><div id="arrow">↑</div><div><div id="btext"></div><div id="bdist"></div></div></div>

<div id="sheet" class="panel">
  <div id="search">
    <div id="results"></div>
    <div class="row">
      <input id="q" placeholder="Search a place, or tap the map" autocomplete="off">
      <button id="gear" class="alt">Setup</button>
    </div>
  </div>
  <div id="trip" hidden>
    <div id="sum"></div>
    <div class="row">
      <button id="mode" class="alt">Drive</button>
      <button id="go">Start</button>
      <button id="mute" class="alt" hidden>Sound on</button>
      <button id="cancel" class="alt">End</button>
    </div>
  </div>
</div>

<div id="settings" class="panel" hidden>
  <b>Setup</b>
  <label for="tok">Mapbox public token</label>
  <input id="tok" placeholder="pk.eyJ...">
  <label for="sty">Your style URL</label>
  <input id="sty" placeholder="mapbox://styles/username/styleid">
  <p class="hint">Saved in this browser only. Restrict the token to this site's URL in your Mapbox account.</p>
  <button id="save">Save and reload</button>
</div>
<div id="toast"></div>

<script>
// Put your own values here so you never have to use the Setup screen:
// token: your Mapbox public token, starts with pk.
// style: your style URL, looks like mapbox://styles/yourusername/yourstyleid
const DEFAULT_TOKEN = 'pk.eyJ1IjoiY3liZXJwdW5rbWFwNzciLCJhIjoiY211ZjFoNGt6MDFvdDQ4cHJreXd4Y3piOSJ9.O4qeYZGAKKg7vHCkiayVTw';
const DEFAULT_STYLE = 'mapbox://styles/cyberpunkmap77/cmuf24crt00dm01sqcg7s4sq3';

const IMPERIAL = true; // set false for km and meters
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let token = store.get('mm_token') || DEFAULT_TOKEN;
let styleUrl = store.get('mm_style') || DEFAULT_STYLE || 'mapbox://styles/mapbox/dark-v11';

function toast(m){
  const t = $('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4500);
}
async function fetchJSON(url, ms = 10000){
  if(!navigator.onLine) throw new Error('No internet connection');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  let r;
  try{
    r = await fetch(url, {signal: ctrl.signal});
  }catch(e){
    if(e.name === 'AbortError') throw new Error('Request timed out — check your connection or try again');
    throw new Error('Network request failed (blocked by Wi-Fi login page, ad blocker, or offline)');
  }finally{ clearTimeout(timer); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Bad response from Mapbox'); }
  if(!r.ok){
    if(r.status === 401) throw new Error('Token rejected — check it\'s a public pk. token and its URL restriction matches this site');
    if(r.status === 429) throw new Error('Rate limited — wait a moment and try again');
    throw new Error(j.message || ('Mapbox error ' + r.status));
  }
  return j;
}

// Settings
$('tok').value = token; $('sty').value = store.get('mm_style');
$('gear').onclick = () => $('settings').hidden = !$('settings').hidden;
$('save').onclick = () => { store.set('mm_token', $('tok').value.trim()); store.set('mm_style', $('sty').value.trim()); location.reload(); };

// Helpers
const R = 6371000, rad = d => d * Math.PI / 180;
function dist(a,b){
  const dLat = rad(b[1]-a[1]), dLng = rad(b[0]-a[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function offRoute(p, line){
  const mx = 111320*Math.cos(rad(p[1])), my = 110540;
  let best = Infinity;
  for(let i=0;i<line.length-1;i++){
    const ax=(line[i][0]-p[0])*mx, ay=(line[i][1]-p[1])*my;
    const dx=(line[i+1][0]-p[0])*mx-ax, dy=(line[i+1][1]-p[1])*my-ay, l2=dx*dx+dy*dy;
    const t = l2 ? Math.max(0, Math.min(1, -(ax*dx+ay*dy)/l2)) : 0;
    best = Math.min(best, Math.hypot(ax+t*dx, ay+t*dy));
  }
  return best;
}
function fmt(m){
  if(IMPERIAL){
    const ft = m*3.281;
    return ft < 500 ? Math.max(50, Math.round(ft/50)*50) + ' ft' : (m/1609.34).toFixed(1) + ' mi';
  }
  return m < 1000 ? Math.max(10, Math.round(m/10)*10) + ' m' : (m/1000).toFixed(1) + ' km';
}
function fmtT(s){ const m = Math.max(1, Math.round(s/60)); return m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + (m%60) + ' min'; }
const WORDS = {ft:'feet', mi:'miles', m:'meters', km:'kilometers'};
const say = m => fmt(m).replace(/ (ft|mi|m|km)$/, (_,u) => ' ' + WORDS[u]);
const ARROWS = {left:'←', right:'→', 'slight left':'↖', 'slight right':'↗', 'sharp left':'↙', 'sharp right':'↘', straight:'↑', uturn:'↶', arrive:'⚑', roundabout:'⟳'};

function speak(t){
  if(muted || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}

// State
let map, marker, markerOn = false, destMarker = null, wake = null;
let me = null, heading = 0, dest = null, route = null, mode = 'driving';
let navigating = false, si = 0, spoken = -1, muted = false, lastReroute = 0, first = true;

if(!token){
  $('settings').hidden = false;
  toast('Add your Mapbox token to begin');
}else{
  mapboxgl.accessToken = token;
  map = new mapboxgl.Map({container:'map', style:styleUrl, center:[-98.5,39.8], zoom:3});
  map.on('error', e => toast((e.error && e.error.message) || 'Map error'));
  const el = document.createElement('div'); el.className = 'me';
  el.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 3 33 35 20 28 7 35Z" fill="#ffc933" stroke="#1a1300" stroke-width="2"/></svg>';
  marker = new mapboxgl.Marker({element:el, rotationAlignment:'map', pitchAlignment:'map'});
  map.on('load', () => {
    map.addSource('route', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    const layout = {'line-cap':'round','line-join':'round'};
    map.addLayer({id:'route-casing', type:'line', source:'route', layout, paint:{'line-color':'#141a22','line-width':11}});
    map.addLayer({id:'route', type:'line', source:'route', layout, paint:{'line-color':'#ffc933','line-width':6}});
    startGPS();
  });
  map.on('click', e => { if(!navigating) setDest([e.lngLat.lng, e.lngLat.lat]); });
}

// GPS
function startGPS(){
  if(!navigator.geolocation) return toast('This browser has no location support');
  navigator.geolocation.watchPosition(onPos, e => toast('Location error: ' + e.message), {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
}
function onPos(p){
  me = [p.coords.longitude, p.coords.latitude];
  if(p.coords.heading != null && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 1) heading = p.coords.heading;
  marker.setLngLat(me).setRotation(heading);
  if(!markerOn){ marker.addTo(map); markerOn = true; }
  if(first){ first = false; map.jumpTo({center:me, zoom:15}); }
  if(navigating) tick();
}

// Search
let qt;
$('q').oninput = e => {
  clearTimeout(qt);
  const v = e.target.value.trim();
  if(v.length < 3){ $('results').innerHTML = ''; return; }
  qt = setTimeout(() => search(v), 350);
};
async function search(v){
  const prox = me ? `&proximity=${me[0]},${me[1]}` : '';
  try{
    const j = await fetchJSON(`https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(v)}&limit=5${prox}&access_token=${token}`);
    const box = $('results'); box.innerHTML = '';
    (j.features || []).forEach(f => {
      const d = document.createElement('div'); d.className = 'res';
      d.textContent = f.properties.full_address || f.properties.name;
      d.onclick = () => { box.innerHTML = ''; $('q').value = ''; setDest(f.geometry.coordinates); };
      box.appendChild(d);
    });
  }catch(e){ toast('Search failed: ' + e.message); }
}

// Routing
async function setDest(c){
  if(!me) return toast('Waiting for your location');
  dest = c;
  if(destMarker) destMarker.remove();
  destMarker = new mapboxgl.Marker({color:'#ff5a4d'}).setLngLat(c).addTo(map);
  await getRoute(false);
}
async function getRoute(isReroute){
  const url = `https://api.mapbox.com/directions/v5/mapbox/${mode}/${me.join(',')};${dest.join(',')}?steps=true&geometries=geojson&overview=full&access_token=${token}`;
  try{
    const j = await fetchJSON(url);
    if(!j.routes || !j.routes.length) throw new Error(j.message || 'No route found');
    route = j.routes[0]; si = 0; spoken = -1;
    map.getSource('route').setData({type:'Feature', geometry:route.geometry});
    if(!isReroute){
      $('sum').innerHTML = `<b>${fmtT(route.duration)}</b><span>${fmt(route.distance)}</span>`;
      $('search').hidden = true; $('trip').hidden = false;
      map.fitBounds(new mapboxgl.LngLatBounds(me, me).extend(dest), {padding:{top:80, bottom:220, left:40, right:40}, pitch:0, bearing:0});
    }
  }catch(e){ toast('Route error: ' + e.message); }
}
$('mode').onclick = () => {
  mode = mode === 'driving' ? 'walking' : 'driving';
  $('mode').textContent = mode === 'driving' ? 'Drive' : 'Walk';
  if(dest && me) getRoute(false);
};

// Navigation
function setNavUI(on){
  $('banner').style.display = on ? 'flex' : 'none';
  $('mode').hidden = on; $('go').hidden = on; $('mute').hidden = !on;
  $('cancel').textContent = on ? 'End trip' : 'End';
}
$('go').onclick = async () => {
  navigating = true; si = 0; spoken = -1; setNavUI(true);
  speak('Starting route');
  try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}
  tick();
};
document.addEventListener('visibilitychange', () => {
  if(navigating && document.visibilityState === 'visible' && navigator.wakeLock)
    navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {});
});
$('mute').onclick = () => {
  muted = !muted; $('mute').textContent = muted ? 'Sound off' : 'Sound on';
  if(muted && window.speechSynthesis) speechSynthesis.cancel();
};
$('cancel').onclick = endNav;

function tick(){
  if(!me || !route) return;
  const steps = route.legs[0].steps;
  while(si < steps.length - 2 && dist(me, steps[si+1].maneuver.location) < 30) si++;
  const m = steps[si+1].maneuver, d = dist(me, m.location);

  if(dist(me, steps[steps.length-1].maneuver.location) < 25){
    speak('You have arrived'); toast('You have arrived'); endNav(); return;
  }

  const key = m.type === 'arrive' ? 'arrive' : (m.type === 'roundabout' || m.type === 'rotary') ? 'roundabout' : m.modifier;
  $('arrow').textContent = ARROWS[key] || '↑';
  $('btext').textContent = m.instruction;
  $('bdist').textContent = fmt(d);

  let rem = d; for(let j = si+1; j < steps.length; j++) rem += steps[j].distance;
  $('sum').innerHTML = `<b>${fmtT(route.duration * rem / (route.distance || 1))}</b><span>${fmt(rem)}</span>`;

  const lead = mode === 'walking' ? 60 : 250;
  if(d < lead && spoken !== si){
    spoken = si;
    speak(m.type === 'arrive' ? m.instruction : `In ${say(d)}, ${m.instruction.charAt(0).toLowerCase() + m.instruction.slice(1)}`);
  }

  if(Date.now() - lastReroute > 15000 && offRoute(me, route.geometry.coordinates) > 60){
    lastReroute = Date.now(); speak('Rerouting'); getRoute(true);
  }

  map.easeTo({center:me, bearing:heading, pitch:60, zoom: mode === 'walking' ? 18 : 16.5, duration:900,
    padding:{top:Math.round(innerHeight*0.3), bottom:0, left:0, right:0}});
}

function endNav(){
  navigating = false; route = null; dest = null;
  map.getSource('route').setData({type:'FeatureCollection', features:[]});
  if(destMarker){ destMarker.remove(); destMarker = null; }
  setNavUI(false); $('trip').hidden = true; $('search').hidden = false;
  try{ if(wake) wake.release(); }catch(e){}
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(me) map.easeTo({center:me, zoom:15, pitch:0, bearing:0, padding:{top:0, bottom:0, left:0, right:0}});
}
</script>
</body>
</html>
